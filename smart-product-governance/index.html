<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Product Governance System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Smart Product Governance System</h1>
  <p class="sub">Register products, run compliance checks, and approve releases only when the rules are met.</p>
</header>
<main>
  <section class="stats" id="stats" aria-label="Summary"></section>
  <div class="grid">
    <section class="panel">
      <h2>Register a product</h2>
      <form id="form" onsubmit="return false">
        <label for="name">Product name</label><input id="name" required placeholder="e.g. Payments API">
        <label for="owner">Owner</label><input id="owner" required placeholder="e.g. Asha Rao">
        <label for="cat">Category</label>
        <select id="cat"><option>Software</option><option>Hardware</option><option>Data product</option><option>Service</option></select>
        <label for="data">Handles personal data?</label>
        <select id="data"><option value="0">No</option><option value="1">Yes</option></select>
        <label for="users">Expected users</label>
        <select id="users"><option value="0">Under 1,000</option><option value="1">1,000 to 100,000</option><option value="2">Over 100,000</option></select>
        <label for="crit">Business criticality</label>
        <select id="crit"><option value="0">Low</option><option value="1">Medium</option><option value="2">High</option></select>
        <button class="primary" id="add">Add product</button>
      </form>
    </section>
    <section class="panel">
      <h2>Product register</h2>
      <div class="scroll"><table>
        <thead><tr><th>Product</th><th>Owner</th><th>Stage</th><th>Risk</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div id="empty" class="empty" hidden>No products yet. Add one to start.</div>
    </section>
  </div>
  <div class="grid">
    <section class="panel detail" id="detail"></section>
    <section class="panel"><h2>Audit trail</h2><ul class="log" id="log"></ul></section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
